# BEDO IoT Factory dashboard — installed by deploy/install-on-pi.sh
# __APP_DIR__ and __PHP_SOCK__ are filled in by the install script.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite bundle (hashed file names) – cache for a long time.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve .env, .git, other PHP files …
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
